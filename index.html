<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randevu Defteri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary-color: #6366f1; --bg-color: #f8f9ff; }
        body { background-color: var(--bg-color); font-family: sans-serif; padding-bottom: 110px; }
        .header-section { padding: 20px; background: white; border-bottom: 1px solid #e2e8f0; }
        .app-card { background: white; border-radius: 20px; padding: 20px; margin: 15px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); position: relative; border: 1px solid #f1f5f9; }
        .time-badge { background: #eef2ff; color: var(--primary-color); font-weight: 600; padding: 4px 12px; border-radius: 10px; display: inline-block; margin-bottom: 10px; }
        .actions { position: absolute; top: 20px; right: 20px; display: flex; gap: 15px; }
        .btn-main { position: fixed; bottom: 30px; left: 20px; right: 20px; background: var(--primary-color); color: white; border: none; padding: 16px; border-radius: 18px; font-weight: 600; z-index: 1000; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .summary-badge { font-size: 0.8rem; font-weight: 600; padding: 6px 12px; border-radius: 50px; }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay"><div class="spinner-border text-primary"></div></div>

<div class="header-section">
    <div class="fw-bold fs-4 mb-2"><i class="bi bi-scissors text-primary"></i> Randevu Defteri</div>
    <div class="d-flex gap-2">
        <span class="summary-badge bg-primary text-white" id="totalCount">Toplam: 0</span>
        <span class="summary-badge bg-success text-white" id="todayCount">Bugün: 0</span>
    </div>
</div>

<div class="p-3">
    <input type="text" id="searchInput" class="form-control mb-2" style="border-radius:12px" placeholder="Müşteri ismi ile ara..." onkeyup="render()">
    <input type="date" id="dateFilter" class="form-control" style="border-radius:12px" onchange="render()">
</div>

<div id="appointmentList"></div>

<button class="btn-main" onclick="resetForm()" data-bs-toggle="modal" data-bs-target="#appModal">
    <i class="bi bi-plus-lg me-2"></i> Yeni Randevu
</button>

<div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4" style="border-radius: 25px;">
            <h5 class="fw-bold" id="mTitle">Yeni Randevu</h5>
            <input type="hidden" id="editIdx">
            <div class="mt-3">
                <label class="small fw-bold">Müşteri Adı</label>
                <input type="text" id="fName" class="form-control rounded-3">
            </div>
            <div class="row mt-3">
                <div class="col-6"><label class="small fw-bold">Tarih</label><input type="date" id="fDate" class="form-control rounded-3"></div>
                <div class="col-6"><label class="small fw-bold">Saat</label><input type="time" id="fTime" class="form-control rounded-3"></div>
            </div>
            <div class="mt-3">
                <label class="small fw-bold">Notlar</label>
                <textarea id="fNotes" class="form-control rounded-3" rows="2"></textarea>
            </div>
            <button class="btn btn-primary w-100 py-3 mt-4 fw-bold" style="border-radius: 15px;" onclick="save()">Kaydet</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwu-buxHRxs2CIhzauCrWHUnGRPHZN_5TWCJUV5o3ez9egOIkG5Tq9LzI394rv9D1yV/exec"; 
    let apps = [];

    async function fetchApps() {
        showLoading(true);
        try {
            const res = await fetch(SCRIPT_URL);
            apps = await res.json();
            render();
        } catch (e) { console.error("Veri hatası:", e); }
        showLoading(false);
    }

    async function save() {
        const id = document.getElementById('editIdx').value;
        const data = {
            action: id ? "update" : "insert",
            id: id || null,
            name: document.getElementById('fName').value,
            date: document.getElementById('fDate').value,
            time: document.getElementById('fTime').value,
            notes: document.getElementById('fNotes').value
        };
        if(!data.name || !data.date || !data.time) return alert("Boş alan bırakmayın!");
        
        showLoading(true);
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
        bootstrap.Modal.getOrCreateInstance(document.getElementById('appModal')).hide();
        fetchApps();
    }

    async function remove(id) {
        if(!confirm("Silmek istediğine emin misin?")) return;
        showLoading(true);
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action: "delete", id: id}) });
        fetchApps();
    }

    function edit(id) {
        const a = apps.find(x => x.id == id);
        if(!a) return;
        document.getElementById('editIdx').value = a.id;
        document.getElementById('fName').value = a.name;
        document.getElementById('fDate').value = a.date.includes('.') ? a.date.split('.').reverse().join('-') : a.date;
        document.getElementById('fTime').value = a.time;
        document.getElementById('fNotes').value = a.notes;
        document.getElementById('mTitle').innerText = "Düzenle";
        new bootstrap.Modal(document.getElementById('appModal')).show();
    }

    function render() {
        const list = document.getElementById('appointmentList');
        const search = document.getElementById('searchInput').value.toLowerCase();
        const dateF = document.getElementById('dateFilter').value;
        const today = new Date().toISOString().split('T')[0];
        list.innerHTML = "";

        let filtered = apps.filter(a => {
            const matchesSearch = a.name.toLowerCase().includes(search);
            const aDateFormated = a.date.includes('.') ? a.date.split('.').reverse().join('-') : a.date;
            const matchesDate = dateF ? (aDateFormated === dateF) : true;
            return matchesSearch && matchesDate;
        }).sort((a,b) => a.time.localeCompare(b.time));

        // Sayaçları Güncelle
        document.getElementById('totalCount').innerText = `Listelenen: ${filtered.length}`;
        const todayCount = apps.filter(a => (a.date.includes('.') ? a.date.split('.').reverse().join('-') : a.date) === today).length;
        document.getElementById('todayCount').innerText = `Bugün Toplam: ${todayCount}`;

        filtered.forEach(a => {
            list.innerHTML += `
                <div class="app-card">
                    <div class="time-badge"><i class="bi bi-clock"></i> ${a.time}</div>
                    <div class="actions">
                        <button class="btn btn-sm text-primary border-0" onclick="edit('${a.id}')"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm text-danger border-0" onclick="remove('${a.id}')"><i class="bi bi-trash"></i></button>
                    </div>
                    <div class="fw-bold">${a.name}</div>
                    <div class="small text-muted"><i class="bi bi-calendar3"></i> ${a.date}</div>
                    ${a.notes ? `<div class="small mt-2 text-secondary"><i>${a.notes}</i></div>` : ''}
                </div>`;
        });
    }

    function resetForm() {
        document.getElementById('editIdx').value = "";
        document.getElementById('fName').value = "";
        document.getElementById('fDate').value = "";
        document.getElementById('fTime').value = "";
        document.getElementById('fNotes').value = "";
        document.getElementById('mTitle').innerText = "Yeni Randevu";
    }

    function showLoading(v) { document.getElementById('loading').style.display = v ? 'flex' : 'none'; }
    fetchApps();
</script>
</body>
</html>
